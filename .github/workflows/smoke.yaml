name: Smoke Tests

on:
  workflow_dispatch:

  repository_dispatch:
    types:
      - run-smoke-tests

jobs:
  smoke:
    env:
      HEADLESS: true

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run Tests
        run: mvn clean test